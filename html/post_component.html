<!-- Publish Dialog -->
<md-dialog id="publish-dialog">
  <div slot="headline">Create Post</div>
  <form slot="content" id="publish-form" method="dialog">
    <md-outlined-text-field
      id="post-content"
      type="textarea"
      label="What's on your mind?"
      rows="3"
      style="width: 100%; margin-bottom: 16px;"
    ></md-outlined-text-field>
    
    <md-outlined-text-field
      id="post-image-url"
      label="Image URL (optional)"
      type="url"
      style="width: 100%; margin-bottom: 16px;"
    ></md-outlined-text-field>

    <md-outlined-text-field
      id="post-tags-text"
      label="Tags (space separated, e.g. #campus)"
      style="width: 100%;"
    ></md-outlined-text-field>
  </form>
  <div slot="actions">
    <md-text-button form="publish-form" value="cancel">Cancel</md-text-button>
    <md-filled-button id="publish-confirm-btn">Post</md-filled-button>
  </div>
</md-dialog>

<!-- Post Detail Dialog (for comments) -->
<md-dialog id="post-detail-dialog" style="min-width: 320px; max-height: 80vh;">
  <div slot="headline">Post Details</div>
  <div slot="content" style="padding-top: 10px;">
    <div id="detail-post-container">
        <!-- Post content cloned here -->
    </div>
    <md-divider style="margin: 16px 0;"></md-divider>
    <div class="comments-section">
      <div class="md-typescale-title-small" style="margin-bottom: 12px;">Comments</div>
      <div id="comments-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
        <!-- Comments injected here -->
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <md-outlined-text-field
            id="new-comment-input"
            label="Write a comment..."
            style="flex: 1;"
        ></md-outlined-text-field>
        <md-icon-button id="send-comment-btn">
            <md-icon>send</md-icon>
        </md-icon-button>
      </div>
    </div>
  </div>
  <div slot="actions">
    <md-text-button value="close" onclick="document.getElementById('post-detail-dialog').close()">Close</md-text-button>
  </div>
</md-dialog>
